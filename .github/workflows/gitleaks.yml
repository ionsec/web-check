# gitleaks: commit + full-history secret scanning for IONSEC repos.
# Binary is checksum-verified in-line (SHA-256 below is of the exact
# gitleaks_8.30.1_linux_x64.tar.gz release asset) so nothing is trusted by tag.
# SARIF lands in Code Scanning on public repos; job fails on any finding.
name: Gitleaks secret scan

on:
  push:
  pull_request:
  schedule:
    - cron: "30 5 * * 1" # Mondays 05:30 UTC - weekly full-history sweep
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

concurrency:
  group: gitleaks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: Scan history for committed secrets
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out full history
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0

      - name: Download gitleaks 8.30.1 and verify checksum
        run: |
          curl -fsSL --retry 3 -o gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz" | sha256sum --check -
          tar -xzf gitleaks.tar.gz gitleaks
          chmod +x gitleaks
          ./gitleaks version

      - name: Scan git history
        id: scan
        continue-on-error: true # report first, gate after upload
        run: |
          ./gitleaks git -v --redact \
            --report-format sarif \
            --report-path "$GITHUB_WORKSPACE/gitleaks.sarif"

      - name: Resolve repository visibility
        id: visibility
        run: |
          private=$(curl -fsSL -H "Authorization: Bearer ${{ github.token }}" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}" | jq -r '.private')
          echo "private=${private}" >> "$GITHUB_OUTPUT"

      - name: Upload SARIF to Code Scanning (public repos)
        if: ${{ always() && steps.visibility.outputs.private == 'false' }}
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: gitleaks.sarif
          category: gitleaks

      - name: Fail if leaks were found
        if: ${{ always() && steps.scan.outcome == 'failure' }}
        run: |
          echo "::error title=Gitleaks::Committed secrets detected (redacted in log; triage via Code Scanning on public repos, or run gitleaks locally with a full report)."
          exit 1